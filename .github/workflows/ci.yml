name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Pinned toolchain. Change both together and record the change in docs/PHASE1_READINESS.md.
# This workflow uploads no artifacts: test logs contain fixture IDs, counts, and timings only,
# and the .xcresult bundle stays on the ephemeral runner.
env:
  XCODE_VERSION: "26.6"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-core-tests:
    name: Build and core tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Require main as the PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          if [ "$BASE_BRANCH" != main ]; then
            echo '::error::Pull requests must target main. Retarget this PR before merging.'
            exit 1
          fi
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select pinned Xcode
        run: |
          app="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$app" ]; then
            echo "::error::Pinned Xcode ${XCODE_VERSION} is not installed on this runner image."
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select --switch "$app/Contents/Developer"
          xcodebuild -version
      - name: Reject artifact uploads
        run: |
          if grep -nE 'uses:[[:space:]]*actions/(upload-artifact|cache)' .github/workflows/*.yml; then
            echo '::error::CI must not upload or cache test artifacts.'
            exit 1
          fi
      - name: Validate project
        run: plutil -lint RedScreen.xcodeproj/project.pbxproj
      - name: Build application
        run: make build
      - name: Run core tests
        run: make test-core

  vscode-extension:
    name: VS Code extension unit tests
    runs-on: macos-26
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Extensions/vscode
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Show Node version
        run: node --version
      # The integration suite launches VS Code and runs locally (npm run test:integration).
      - name: Install pinned dev dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run unit, protocol, and package tests
        run: npm test
