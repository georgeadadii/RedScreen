name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-core-tests:
    name: Build and core tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Require main as the PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          if [ "$BASE_BRANCH" != main ]; then
            echo '::error::Pull requests must target main. Retarget this PR before merging.'
            exit 1
          fi
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Validate project
        run: plutil -lint RedScreen.xcodeproj/project.pbxproj
      - name: Build application
        run: make build
      - name: Run core tests
        run: make test-core
